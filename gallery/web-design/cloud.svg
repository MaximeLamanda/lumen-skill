<svg xmlns="http://www.w3.org/2000/svg" class="lm-16lnppj" viewBox="0 0 200 200" width="200" height="200" role="img"><title>cloud</title><desc>A cloud in one piece with a lit point of data under it and a beam rising into the cloud. On hover the beam climbs and dissolves, and the cloud swells.</desc><style>@media (prefers-reduced-motion:no-preference){.lm-16lnppj-0{transform-box:view-box;transform-origin:100px 79px;transition:transform 0.45s cubic-bezier(.32,.72,0,1)}:is(svg.lm-16lnppj:is(:hover,.lm-on),.lm-host:is(:hover,:focus-visible,:focus-within) svg.lm-16lnppj) .lm-16lnppj-0{transform:scale(1.05);transition:transform 0.7s cubic-bezier(.32,.72,0,1);transition-delay:0.3s}.lm-16lnppj-1{transition:transform 0.45s cubic-bezier(.32,.72,0,1),opacity 0.45s cubic-bezier(.32,.72,0,1)}:is(svg.lm-16lnppj:is(:hover,.lm-on),.lm-host:is(:hover,:focus-visible,:focus-within) svg.lm-16lnppj) .lm-16lnppj-1{transform:translate(0px,-12px);opacity:0;transition:transform 0.7s cubic-bezier(.32,.72,0,1),opacity 0.7s cubic-bezier(.32,.72,0,1);transition-delay:0s}.lm-16lnppj-2{transform-box:view-box;transform-origin:100px 146px;transition:transform 0.45s cubic-bezier(.32,.72,0,1)}:is(svg.lm-16lnppj:is(:hover,.lm-on),.lm-host:is(:hover,:focus-visible,:focus-within) svg.lm-16lnppj) .lm-16lnppj-2{transform:scale(1.2);transition:transform 0.7s cubic-bezier(.32,.72,0,1);transition-delay:0.1s}}</style><defs><linearGradient id="lm-ltk4sm" x1="0.5" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#4553FE" stop-opacity="0.03"/><stop offset="1" stop-color="#4553FE" stop-opacity="0.52"/></linearGradient><linearGradient id="lm-bzrqdj" x1="0.5" y1="1" x2="0.5" y2="0"><stop offset="0" stop-color="#4553FE" stop-opacity="0.52"/><stop offset="1" stop-color="#4553FE" stop-opacity="0.03"/></linearGradient><radialGradient id="lm-ryeopj" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4553FE" stop-opacity="1"/><stop offset="0.5" stop-color="#4553FE" stop-opacity="1"/><stop offset="1" stop-color="#